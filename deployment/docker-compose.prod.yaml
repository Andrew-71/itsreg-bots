services:
  bots-http:
    container_name: ir-bots-http
    build:
      context: ../
    ports:
      - 8400:${PORT:-8400}
    env_file:
      - ../.env
    depends_on:
      bots-db:
        condition: service_healthy
    networks:
      - ir-web-bots

  bots-db:
    image: postgres:15.3-alpine3.18
    container_name: ir-bots-postgres
    command: postgres
    ports:
      - "54321:5432"
    env_file:
      - ../.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 10s
    volumes:
      - ~/.docker/itsreg/postgres/data:/var/lib/postgresql/data
    networks:
      ir-web-bots:
        aliases:
          - db

  bots-migrate:
    image: migrate/migrate
    container_name: ir-bots-migrate
    networks:
      - ir-web-bots
    volumes:
      - ../migrations:/migrations
    env_file:
      - ../.env
    command: [ "-path", "/migrations", "-database", "$DATABASE_URI", "up" ]
    depends_on:
      bots-db:
        condition: service_healthy

networks:
  ir-web-bots:
    driver: bridge
